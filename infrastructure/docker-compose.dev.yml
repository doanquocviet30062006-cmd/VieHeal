services:

  postgres:
    image: postgres:17
    container_name: clinic-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: clinic_platform
      POSTGRES_USER: ${CLINIC_DB_USERNAME:-clinic_app}
      POSTGRES_PASSWORD: ${CLINIC_DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - clinic_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U clinic_app -d clinic_platform
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  keycloak-postgres:
    image: postgres:17
    container_name: clinic-keycloak-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U keycloak -d keycloak
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: clinic-keycloak
    restart: unless-stopped

    command:
      - start-dev

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

    ports:
      - "8081:8080"

    depends_on:
      keycloak-postgres:
        condition: service_healthy


volumes:
  clinic_postgres_data:
  keycloak_postgres_data: